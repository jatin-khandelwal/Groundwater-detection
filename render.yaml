services:
  - type: web
    name: groundwater-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.scripts.render_start
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: GW_DATABASE_PATH
        value: /tmp/groundwater.sqlite3
      - key: GW_AUTO_INIT_DB
        value: "0"
      - key: GW_ARTIFACT_URL
        value: https://raw.githubusercontent.com/jatin-khandelwal/Groundwater-detection/render-artifacts-v2/render_artifacts.zip
      - key: GW_ARTIFACT_SHA256
        value: 49742c44fb22859451be0dce482be5e36c15668cbce152dd75dbc888219a53ed
      - key: GW_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: GW_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: GW_SMTP_HOST
        value: smtp.gmail.com
      - key: GW_SMTP_PORT
        value: "587"
      - key: GW_SMTP_USERNAME
        sync: false
      - key: GW_SMTP_PASSWORD
        sync: false
      - key: GW_MAIL_FROM
        sync: false
      - key: GW_ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: GW_PUBLIC_FRONTEND_URL
        value: https://groundwater-frontend.onrender.com

  - type: web
    name: groundwater-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt -r frontend/requirements.txt
    startCommand: python -m backend.scripts.render_combined_start
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: GW_API_TIMEOUT_SECONDS
        value: "120"
      - key: GW_API_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: GW_API_URL
        value: http://127.0.0.1:8001
      - key: GW_DATABASE_PATH
        value: /tmp/groundwater.sqlite3
      - key: GW_AUTO_INIT_DB
        value: "0"
      - key: GW_ARTIFACT_URL
        value: https://raw.githubusercontent.com/jatin-khandelwal/Groundwater-detection/render-artifacts-v2/render_artifacts.zip
      - key: GW_ARTIFACT_SHA256
        value: 49742c44fb22859451be0dce482be5e36c15668cbce152dd75dbc888219a53ed
      - key: GW_BOOTSTRAP_ADMIN_EMAIL
        fromService:
          type: web
          name: groundwater-api
          envVarKey: GW_BOOTSTRAP_ADMIN_EMAIL
      - key: GW_BOOTSTRAP_ADMIN_PASSWORD
        fromService:
          type: web
          name: groundwater-api
          envVarKey: GW_BOOTSTRAP_ADMIN_PASSWORD
      - key: GW_PUBLIC_FRONTEND_URL
        value: https://groundwater-frontend.onrender.com
