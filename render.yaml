services:
  - type: web
    name: groundwater-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.scripts.render_start
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: GW_DATABASE_PATH
        value: /tmp/groundwater.sqlite3
      - key: GW_AUTO_INIT_DB
        value: "0"
      - key: GW_ARTIFACT_URL
        sync: false
      - key: GW_ARTIFACT_SHA256
        value: dd8c6593007f97dadb7eac4d474815d5661f1eba00f193b6c482b0808ba8f56a
      - key: GW_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: GW_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: groundwater-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: GW_API_TIMEOUT_SECONDS
        value: "120"
      - key: GW_API_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: GW_API_URL
        fromService:
          type: web
          name: groundwater-api
          envVarKey: RENDER_EXTERNAL_URL
